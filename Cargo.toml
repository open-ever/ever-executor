[package]
build = 'common/build/build.rs'
edition = '2021'
name = 'ever_executor'
version = '1.18.32'

[dependencies]
anyhow = '1.0'
lazy_static = '1.4'
log = '0.4'
thiserror = '1.0'
ever_block = { git = 'https://github.com/open-ever/ever-block.git', tag = '1.11.23' }
ever_vm = { git = 'https://github.com/open-ever/ever-vm.git', tag = '2.2.27' }

[dev-dependencies]
criterion = { features = [ 'html_reports' ], version = '0.3' }
libloading = '0.6'
log4rs = '1.2'
pretty_assertions = '1.3'
rand = '0.8'
serde = { features = [ 'derive' ], version = '1.0' }
serde_json = '1.0'
ever_assembler = { git = 'https://github.com/open-ever/ever-assembler.git' }

[features]
ci_run = [  ]
cross_check = [  ]
gosh = [ 'ever_vm/gosh', 'ever_block/gosh' ]
ihr_disabled = [  ]
signature_with_id = [ 'ever_block/signature_with_id', 'ever_vm/signature_with_id' ]
timings = [  ]

[[bench]]
harness = false
name = 'benchmarks'

[lib]
bench = false

[profile]

